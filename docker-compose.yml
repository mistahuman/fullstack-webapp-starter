services:

  mongo:
    image: mongo:7
    restart: unless-stopped
    env_file: .env
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      - mongo

  ui:
    build: ./ui
    restart: unless-stopped
    env_file: ./ui/.env
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - ui

volumes:
  mongo_data:
